<style>
:root{--bg:#F2F0ED;--panel:#FFF;--panel2:#F8F6F4;--panel3:#F1EEEA;--line:#E8E3DD;--line2:#DAD3CB;

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;

h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:-.01em;line-height:1.15}
::selection{background:var(--gold);color:#fff}
.wrap{max-width:1360px;margin:0 auto;padding:0 22px}
header.top{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:#ffffffea;border-bottom:1px solid var(--line)}

.brand .t{font-family:'Space Grotesk';font-weight:700;font-size:15px}
.brand .s{font-size:10.5px;color:var(--muted);letter-spacing:.13em;text-transform:uppercase;margin-top:1px}
nav.tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{background:transparent;border:0;color:var(--ink2);font-family:'Space Grotesk';font-weight:500;font-size:12.5px;padding:8px 12px;border-radius:9px;cursor:pointer;transition:.16s;white-space:nowrap}
nav.tabs button:hover{color:var(--ink);background:var(--panel3)}
nav.tabs button.on{color:#fff;background:var(--gold);font-weight:600;box-shadow:0 2px 8px -2px #f0531488}
.filters{display:flex;gap:14px;align-items:center;padding:9px 0 11px;border-top:1px solid var(--line);flex-wrap:wrap}
.fg{display:flex;align-items:center;gap:7px}
.fg>label{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600;font-family:'JetBrains Mono'}
.seg{display:inline-flex;background:var(--panel3);border-radius:9px;padding:2px;gap:2px}
.seg button{background:transparent;border:0;font-family:'Space Grotesk';font-weight:500;font-size:12px;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--ink2);transition:.14s}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:var(--sh1)}
select{font-family:'Inter';font-size:12.5px;padding:6px 9px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
.tgl{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.tgl .bx{width:34px;height:19px;border-radius:99px;background:var(--line2);position:relative;transition:.18s}
.tgl .bx::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:99px;background:#fff;transition:.18s;box-shadow:0 1px 3px #0003}
.tgl.on .bx{background:var(--green)}.tgl.on .bx::after{transform:translateX(15px)}
.tgl span{font-size:12px;color:var(--ink2)}
.page{display:none;padding:24px 0 80px;animation:fade .3s ease}.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;font-family:'JetBrains Mono';display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--gold)}
.h-title{font-size:27px;margin:9px 0 6px}
.h-sub{color:var(--ink2);max-width:920px;font-size:13.5px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1)}
.card{padding:19px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:1.55fr 1fr}.g12{grid-template-columns:1fr 1.55fr}
@media(max-width:1000px){.g4,.g3,.g2,.g21,.g12{grid-template-columns:1fr}}
.kpi .lab{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600;font-family:'JetBrains Mono'}
.kpi .val{font-family:'Space Grotesk';font-weight:700;font-size:28px;margin:7px 0 3px;letter-spacing:-.02em}

.pos{color:var(--green)}.neg{color:var(--coral)}.mut{color:var(--muted)}

.p-g{background:var(--greentint);color:var(--green)}.p-r{background:var(--coraltint);color:var(--coral)}
.p-a{background:var(--ambertint);color:var(--amber)}.p-b{background:var(--bluetint);color:var(--blue)}
.p-m{background:var(--panel3);color:var(--ink2)}

.narr h3{font-size:15px;margin-bottom:6px}

.narr b{color:var(--ink);font-weight:600}
.narr .verdict{font-family:'Space Grotesk';font-weight:700;font-size:13px;margin-bottom:5px;display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:99px;display:inline-block}
svg{display:block;overflow:visible}
.tip{position:fixed;pointer-events:none;background:#26211Cf2;color:#fff;font-size:11.5px;padding:7px 10px;border-radius:8px;z-index:200;opacity:0;transition:opacity .1s;font-family:'Inter';box-shadow:0 6px 20px #0003;max-width:280px}

.note-s{font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.45}
.src{font-size:11px;color:var(--muted);font-family:'JetBrains Mono';margin-top:8px}
.bar-wrap{position:relative;height:9px;background:var(--panel3);border-radius:4px;overflow:hidden;min-width:56px}
.bar-wrap i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}

.stk{cursor:pointer}

hment bulanan, tidak di-run-rate"},{"a":"Gerobak Sales","rp":14537,"b":"Tab 02 \u00b7 14 hari lengkap \u00d7 30/14"},{"a":"Overtime Tanggal Merah Casual","rp":13320,"b":"Baseline \u00b7 aktual Agustus (tidak ada sumber bergerak)"},{"a":"Overtime Tanggal Merah","rp":7897,"b":"Baseline \u00b7 aktual Agustus (tidak ada sumber bergerak)"},{"a":"Complaint Refund","rp":5862,"b":"Baseline \u00b7 aktual Agustus (tidak ada sumber bergerak)"},{"a":"Travel Allowance","rp":4587,"b":"Baseline \u00b7 aktual Agustus (tidak ada sumber bergerak)"},{"a":"Renovation expense","rp":4264,"b":"Baseline \u00b7 aktual Agustus (tidak ada sumber bergerak)"},{"a":"Overtime","rp":3855,"b":"Baseline \u00b7 aktual Agustus (tidak ada sumber bergerak)"},{"a":"Commission of Tiktok Sales","rp":2637,"b":"Baseline \u00b7 aktual Agustus (tidak ada sumber bergerak)"},{"a":"Sponsorship and event","rp":2426,"b":"Baseline \u00b7 aktual Agustus (tidak ada sumber bergerak)"},{"a":"Qpon Sales","rp":2419,"b":"Baseline \u00b7 aktual Agustus (tidak ada sumber bergerak)"},{"a":"Onboarding and Training Cost","rp":2295,"b":"Baseline \u00b7 aktual Agustus (tidak ada sumber bergerak)"},{"a":"MDR Fee","rp":2078,"b":"Baseline \u00b7 aktual Agustus (tidak ada sumber bergerak)"},{"a":"Cofunding Tiktok Sales","rp":1529,"b":"Baseline \u00b7 aktual Agustus (tidak ada sumber bergerak)"},{"a":"Travel Cost","rp":1500,"b":"Baseline \u00b7 aktual Agustus (tidak ada sumber bergerak)"},{"a":"BPJS Ketenagakerjaan","rp":1470,"b":"Tab 07 \u00b7 establishment bulanan, tidak di-run-rate"},{"a":"Internal Discount of Tiktok Sales","rp":1211,"b":"Baseline \u00b7 aktual Agustus (tidak ada sumber bergerak)"},{"a":"Event Sales","rp":848,"b":"Tab 02 \u00b7 14 hari lengkap \u00d7 30/14"},{"a":"Maxim Sales","rp":790,"b":"Baseline \u00b7 aktual Agustus (tidak ada sumber bergerak)"},{"a":"Transportation Expense","rp":340,"b":"Tab 11 \u00b7 petty cash 16 hari \u00d7 30/16"},{"a":"Internal Discount of Qpon Sales","rp":215,"b":"Baseline \u00b7 aktual Agustus (tidak ada sumber bergerak)"},{"a":"Commission of Qpon Sales","rp":111,"b":"Baseline \u00b7 aktual Agustus (tidak ada sumber bergerak)"},{"a":"Commission of Maxim Sales","rp":83,"b":"Baseline \u00b7 aktual Agustus (tidak ada sumber bergerak)"},{"a":"Platform Price Adjustment Revenue of Maxim","rp":67,"b":"Baseline \u00b7 aktual Agustus (tidak ada sumber bergerak)"},{"a":"Platform Price Adjustment Revenue of Tiktok","rp":55,"b":"Baseline \u00b7 aktual Agustus (tidak ada sumber bergerak)"},{"a":"Internal Discount of Maxim","rp":18,"b":"Baseline \u00b7 aktual Agustus (tidak ada sumber bergerak)"},{"a":"Platform Price Adjustment Revenue of Qpon","rp":12,"b":"Baseline \u00b7 aktual Agustus (tidak ada sumber bergerak)"}]}</script>
<script>
const D=JSON.parse(document.getElementById('D').textContent);
const K=1000;                                   // nilai disimpan dalam ribuan rupiah
const MI={}; D.met.forEach((m,i)=>MI[m]=i);
const SUB=new Set(D.sub), INV=new Set(D.inv);
const PAL={jul:'#1B8560',ags:'#2E6BB0',sep:'#F05314',green:'#1B8560',coral:'#CF3A22',amber:'#B07A12',blue:'#2E6BB0',gold:'#F05314',mut:'#95897C'};
const BULAN=['Jul','Ags','Sep'];
const BLAB={Jul:'Juli',Ags:'Agustus',Sep:'September'};
const ACTF={Jul:'Aktual',Ags:'Aktual',Sep:'Run-rate'};
const PI={}; D.periods.forEach((p,i)=>PI[p.k+'|'+p.f]=i);
const pAct=b=>PI[b+'|'+ACTF[b]], pPlan=b=>PI[b+'|Plan'];
const NO_DA=new Set([pAct('Ags'),pAct('Sep')]);   // periode yang belum mengalokasikan D&A

const S={bulan:'Sep',som:'',reg:'',da:false,tab:'sum',sortK:'dp',sortD:-1,plMode:'sel'};

/* ---------- format ---------- */
const mn_=s=>s.replace('-','\u2212');
const jt=v=>mn_((v/1e6).toLocaleString('id-ID',{maximumFractionDigits:0}));
const jt1=v=>mn_((v/1e6).toLocaleString('id-ID',{minimumFractionDigits:1,maximumFractionDigits:1}));
const rp=v=>{const a=Math.abs(v);if(a>=1e9)return mn_((v/1e9).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2}))+' M';return jt(v)+' jt';};
const sgn=v=>(v>0?'+':v<0?'−':'')+jt(Math.abs(v));
const pc=(v,d)=>mn_((v*100).toLocaleString('id-ID',{minimumFractionDigits:d===undefined?1:d,maximumFractionDigits:d===undefined?1:d}))+'%';
const pp=v=>(v>=0?'+':'−')+Math.abs(v).toLocaleString('id-ID',{minimumFractionDigits:1,maximumFractionDigits:1})+' pp';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- seleksi store ---------- */
function ids(){return D.stores.filter(s=>(!S.som||s.som===S.som)&&(!S.reg||s.reg===S.reg)).map(s=>s.i);}
function vec(pi,i){const a=D.v[pi][i].map(x=>x*K);
  if(S.da&&NO_DA.has(pi)){const da=D.da[i]*K;a[MI.R150]+=da;a[MI.R180]+=da;a[MI.R190]-=da;}
  return a;}
function agg(pi,list){const o=new Array(D.met.length).fill(0);
  for(const i of (list||ids())){const a=vec(pi,i);for(let k=0;k<o.length;k++)o[k]+=a[k];}return o;}
const dp=(pi,i)=>vec(pi,i)[MI.R190], gs=(pi,i)=>vec(pi,i)[MI.R010];

/* ---------- tooltip ---------- */
const TIP=document.getElementById('tip');
function tipOn(e,html){TIP.innerHTML=html;TIP.classList.add('on');
  const r=TIP.getBoundingClientRect();let x=e.clientX+14,y=e.clientY-10;
  if(x+r.width>innerWidth-8)x=e.clientX-r.width-14; if(y+r.height>innerHeight-8)y=innerHeight-r.height-8;
  TIP.style.left=x+'px';TIP.style.top=Math.max(8,y)+'px';}
function tipOff(){TIP.classList.remove('on');}
function bind(el){el.addEventListener('mousemove',e=>tipOn(e,el.dataset.tip));el.addEventListener('mouseleave',tipOff);}

/* =======================================================================
   RINGKASAN
   ======================================================================= */
function pgSum(){
  const L=ids(),b=S.bulan,pa=pAct(b),pp_=pPlan(b);
  const A=agg(pa,L),P=agg(pp_,L);
  const prevB=b==='Sep'?'Ags':b==='Ags'?'Jul':null;
  const PV=prevB?agg(pAct(prevB),L):null;
  const dpA=A[MI.R190],dpP=P[MI.R190],gsA=A[MI.R010];
  const neg=L.filter(i=>dp(pa,i)<0), negRp=neg.reduce((t,i)=>t+dp(pa,i),0);
  const ach=L.filter(i=>dp(pa,i)>=dp(pp_,i));
  // carrier = store yang kumulatif menyumbang 50% profit positif
  const pos=L.filter(i=>dp(pa,i)>0).sort((x,y)=>dp(pa,y)-dp(pa,x));
  const totPos=pos.reduce((t,i)=>t+dp(pa,i),0);
  let cum=0,carr=[];for(const i of pos){carr.push(i);cum+=dp(pa,i);if(cum>=totPos*0.5)break;}
  const carrSet=new Set(carr);
  const carrNow=carr.reduce((t,i)=>t+dp(pa,i),0);
  const carrPrev=PV?carr.reduce((t,i)=>t+dp(pAct(prevB),i),0):null;
  const carrDelta=PV?carrNow-carrPrev:null;
  const restNow=dpA-carrNow, restPrev=PV?PV[MI.R190]-carrPrev:null;
  const turun=PV?carr.filter(i=>dp(pa,i)<dp(pAct(prevB),i)):[];
  const nm=i=>D.stores[i].id+' '+D.stores[i].nm;

  const q1ok=neg.length===0;
  const q2ok=PV?carrDelta>=0:null;
  const q3=ach.length/L.length;

  let h=`<div class="eyebrow">Ringkasan</div>
  <h1 class="h-title">Profitabilitas ${BLAB[b]} 2026 — ${L.length} store</h1>
  <p class="h-sub">Store Direct Profit <b>${rp(dpA)}</b> atau ${pc(dpA/gsA,2)} dari Gross Sales, terhadap Plan ${rp(dpP)} (${pc(dpP/P[MI.R010],2)}). Selisih ${sgn(dpA-dpP)} juta.</p>
  <div class="grid g4" style="margin-top:18px">
    ${kpi('Store Direct Profit',rp(dpA),pc(dpA/gsA,2)+' Gross Sales',dpA>=dpP?'green':'coral')}
    ${kpi('Terhadap Plan',sgn(dpA-dpP)+' jt',pp((dpA/gsA-dpP/P[MI.R010])*100)+' margin',dpA>=dpP?'green':'coral')}
    ${kpi('Store profitable',(L.length-neg.length)+' / '+L.length,neg.length===0?'Tidak ada store rugi':neg.length+' store rugi '+rp(Math.abs(negRp)),q1ok?'green':'coral')}
    ${kpi('Capai target profit',pc(q3,0),ach.length+' dari '+L.length+' store',q3>=0.5?'green':q3>=0.3?'amber':'coral')}
  </div>`;

  h+=`<div class="sec-h"><h2>Tiga pertanyaan yang harus dijawab tiap bulan</h2></div><div class="panel card">`;

  h+=narr(q1ok?'green':'coral',
    q1ok?'Ya — seluruh store profitable':`Tidak — ${neg.length} dari ${L.length} store masih rugi`,
    q1ok?`Semua ${L.length} store dalam cakupan mencetak Store Direct Profit positif di ${BLAB[b]}. Margin terendah ${pc(Math.min(...L.map(i=>dp(pa,i)/Math.max(gs(pa,i),1))),1)} di ${nm(L.slice().sort((x,y)=>dp(pa,x)/Math.max(gs(pa,x),1)-dp(pa,y)/Math.max(gs(pa,y),1))[0])}.`
    :`Total kerugiannya <b>${rp(Math.abs(negRp))}</b>, setara ${pc(Math.abs(negRp)/dpA,1)} dari profit yang dihasilkan store lain. Yang rugi: ${neg.sort((x,y)=>dp(pa,x)-dp(pa,y)).map(i=>`<b>${esc(nm(i))}</b> (${rp(dp(pa,i))}, ${pc(dp(pa,i)/Math.max(gs(pa,i),1),1)})`).join(', ')}.`);

  if(PV){
    h+=narr(q2ok?'green':'coral',
      q2ok?'Store penopang profit masih naik':'Store penopang profit sedang turun',
      `<b>${carr.length} store</b> menopang separuh profit ${BLAB[b]} (${rp(carrNow)} dari ${rp(dpA)}). Dibanding ${BLAB[prevB]}, kelompok ini ${carrDelta>=0?'naik':'turun'} <b>${sgn(carrDelta)} juta</b> (${pc(carrDelta/Math.abs(carrPrev),1)}), sementara ${L.length-carr.length} store sisanya ${restNow-restPrev>=0?'naik':'turun'} ${sgn(restNow-restPrev)} juta. ${turun.length?`Di dalam kelompok penopang, <b>${turun.length} store turun</b>: `+turun.sort((x,y)=>(dp(pa,x)-dp(pAct(prevB),x))-(dp(pa,y)-dp(pAct(prevB),y))).slice(0,5).map(i=>`${esc(nm(i))} (${sgn(dp(pa,i)-dp(pAct(prevB),i))} jt)`).join(', ')+'.':'Tidak ada satu pun penopang yang turun.'}`);
  }else{
    h+=narr('mut','Pergerakan penopang belum bisa dinilai',`${BLAB[b]} adalah bulan paling awal pada dashboard ini, jadi tidak ada bulan pembanding. <b>${carr.length} store</b> menopang separuh profit (${rp(carrNow)}).`);
  }

  h+=narr(q3>=0.5?'green':q3>=0.3?'amber':'coral',
    `${pc(q3,0)} store mencapai target profit`,
    `<b>${ach.length} dari ${L.length} store</b> mencetak Direct Profit di atas Plan ${BLAB[b]}. Gap agregat ${sgn(dpA-dpP)} juta: store yang meleset menarik ${rp(L.filter(i=>dp(pa,i)<dp(pp_,i)).reduce((t,i)=>t+dp(pa,i)-dp(pp_,i),0))}, store yang lewat target menyumbang ${rp(ach.reduce((t,i)=>t+dp(pa,i)-dp(pp_,i),0))}.`);
  h+='</div>';

  // ---- tren + struktur
  h+=`<div class="sec-h"><h2>Pergerakan tiga bulan</h2><span class="d">Store Direct Profit, aktual terhadap plan</span></div>
  <div class="grid g21">
    <div class="panel card">${chTren(L)}</div>
    <div class="panel card">${tblStruk(L)}</div>
  </div>`;

  h+=`<div class="sec-h"><h2>Jembatan Plan ${BLAB[b]} ke ${ACTF[b]}</h2><span class="d">Efek volume dipisah dari efek tarif, residual nol</span></div>
  <div class="panel card">${chBridge(P,A)}</div>`;
  return h;
}
function kpi(l,v,n,c){return `<div class="panel card kpi"><div class="lab">${l}</div><div class="val" style="color:var(--${c})">${v}</div><div class="note">${n}</div></div>`;}
function narr(c,v,t){const col=c==='mut'?'var(--muted)':`var(--${c})`;
  return `<div class="narr" style="border-color:${col}"><div class="verdict" style="color:${col}"><span class="dot" style="background:${col}"></span>${v}</div><p>${t}</p></div>`;}

/* ---------- chart tren ---------- */
function chTren(L){
  const W=560,H=250,ml=58,mr=14,mt=16,mb=34;
  const A=BULAN.map(b=>agg(pAct(b),L)[MI.R190]), P=BULAN.map(b=>agg(pPlan(b),L)[MI.R190]);
  const all=A.concat(P);const mx=Math.max(...all)*1.14,mn=Math.min(0,Math.min(...all)*1.1);
  const x=i=>ml+(W-ml-mr)*(i/(BULAN.length-1)), y=v=>mt+(H-mt-mb)*(1-(v-mn)/(mx-mn));
  let g='';for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4;g+=`<line x1="${ml}" x2="${W-mr}" y1="${y(v)}" y2="${y(v)}" stroke="#E8E3DD" stroke-width="1"/><text x="${ml-9}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#95897C" font-family="JetBrains Mono">${jt(v)}</text>`;}
  const path=a=>a.map((v,i)=>(i?'L':'M')+x(i)+' '+y(v)).join(' ');
  let m='';
  BULAN.forEach((b,i)=>{
    m+=`<circle cx="${x(i)}" cy="${y(P[i])}" r="5" fill="#fff" stroke="${PAL.mut}" stroke-width="2"/>`;
    m+=`<circle class="hv" cx="${x(i)}" cy="${y(A[i])}" r="6" fill="${PAL.gold}" stroke="#fff" stroke-width="2" data-tip="<b>${BLAB[b]}</b><br>${ACTF[b]} ${rp(A[i])}<br>Plan ${rp(P[i])}<br>Selisih ${sgn(A[i]-P[i])} jt"/>`;
    m+=`<text x="${x(i)}" y="${y(A[i])+(A[i]<P[i]?22:-14)}" text-anchor="${i===0?'start':i===BULAN.length-1?'end':'middle'}" font-size="11.5" font-weight="700" fill="#26211C" font-family="JetBrains Mono">${jt(A[i])}</text>`;
    m+=`<text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="11.5" fill="#5C544A" font-family="Space Grotesk">${BLAB[b]}</text>`;
  });
  return `<div class="legend"><span><i style="background:${PAL.gold}"></i>Aktual / Run-rate</span><span><i style="background:${PAL.mut}"></i>Plan</span></div>
  <svg viewBox="0 0 ${W} ${H}" width="100%">${g}
  <path d="${path(P)}" fill="none" stroke="${PAL.mut}" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="${path(A)}" fill="none" stroke="${PAL.gold}" stroke-width="2.5"/>${m}</svg>
  <div class="note-s">Rp juta. September memakai run-rate dari data berjalan yang disetahunkan ke 30 hari.</div>`;
}

/* ---------- tabel struktur ---------- */
function tblStruk(L){
  const rows=['R010','R070','R110','R120','R130','R140','R180','R190'];
  let h='<table><thead><tr><th>% Gross Sales</th>'+BULAN.map(b=>`<th>${b}</th>`).join('')+'<th>Plan '+S.bulan+'</th></tr></thead><tbody>';
  const pl=agg(pPlan(S.bulan),L);
  rows.forEach(k=>{
    const cls=SUB.has(k)?'sub':'';
    h+=`<tr class="${cls}"><td>${D.metLab[k]}</td>`;
    BULAN.forEach(b=>{const a=agg(pAct(b),L);h+=`<td class="num">${pc(a[MI[k]]/a[MI.R010],1)}</td>`;});
    h+=`<td class="num mut">${pc(pl[MI[k]]/pl[MI.R010],1)}</td></tr>`;
  });
  return h+'</tbody></table><div class="note-s">Seluruh baris dibagi Gross Sales periode masing-masing.</div>';
}

/* ---------- bridge ---------- */
function chBridge(P,A){
  const gs0=P[MI.R010],gs1=A[MI.R010];
  const f=(X,k)=>X[MI[k]]/X[MI.R010];
  const m0=f(P,'R070')-f(P,'R110')-f(P,'R130');
  const it=[['Gross Sales',(gs1-gs0)*m0],['Net Revenue Margin',gs1*(f(A,'R070')-f(P,'R070'))],
    ['COGS % GS',-gs1*(f(A,'R110')-f(P,'R110'))],['Variable Opex % GS',-gs1*(f(A,'R130')-f(P,'R130'))],
    ['Fixed Opex',-(A[MI.R180]-P[MI.R180])]];
  const W=900,H=236,mt=26,mb=44,ml=6;
  const st=P[MI.R190],en=A[MI.R190];
  let cum=st;const pts=[st];it.forEach(i=>{cum+=i[1];pts.push(cum);});
  const all=pts.concat([st,en]);const mx=Math.max(...all)*1.1,mn=Math.min(0,Math.min(...all));
  const n=it.length+2,bw=(W-ml*2)/n*0.6,gap=(W-ml*2)/n;
  const y=v=>mt+(H-mt-mb)*(1-(v-mn)/(mx-mn));
  const cx=i=>ml+gap*i+gap/2;
  let s='';
  const bar=(i,v0,v1,col,lab,val,tip)=>{
    const yt=y(Math.max(v0,v1)),hh=Math.abs(y(v0)-y(v1));
    s+=`<rect class="hv" x="${cx(i)-bw/2}" y="${yt}" width="${bw}" height="${Math.max(hh,2)}" rx="3" fill="${col}" data-tip="${tip}"/>`;
    s+=`<text x="${cx(i)}" y="${yt-7}" text-anchor="middle" font-size="11" font-weight="700" fill="${col}" font-family="JetBrains Mono">${val}</text>`;
    s+=`<text x="${cx(i)}" y="${H-24}" text-anchor="middle" font-size="10" fill="#5C544A" font-family="Inter">${lab.split(' ').slice(0,2).join(' ')}</text>`;
    if(lab.split(' ').length>2)s+=`<text x="${cx(i)}" y="${H-12}" text-anchor="middle" font-size="10" fill="#5C544A">${lab.split(' ').slice(2).join(' ')}</text>`;
  };
  bar(0,mn,st,'#2A2E6B','Plan '+S.bulan,jt(st),`Plan ${S.bulan} ${rp(st)}`);
  it.forEach((t,k)=>{const v0=pts[k],v1=pts[k+1];
    bar(k+1,v0,v1,t[1]>=0?PAL.green:PAL.coral,t[0],sgn(t[1]),`${t[0]}<br><b>${sgn(t[1])} jt</b>`);
    s+=`<line x1="${cx(k)+bw/2}" x2="${cx(k+1)-bw/2}" y1="${y(v0)}" y2="${y(v0)}" stroke="#DAD3CB" stroke-width="1" stroke-dasharray="3 3"/>`;});
  bar(n-1,mn,en,'#2A2E6B',ACTF[S.bulan]+' '+S.bulan,jt(en),`${ACTF[S.bulan]} ${rp(en)}`);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${s}</svg>
  <div class="note-s">Rp juta. ΔDP = (GS₁−GS₀)·m₀ + GS₁·(m₁−m₀) − ΔFixedOpex, dengan m = NRM% − COGS% − VarOpex%. Residual nol.</div>`;
}

/* =======================================================================
   P&L
   ======================================================================= */
function pgPL(){
  const L=ids(),b=S.bulan;
  let h=`<div class="eyebrow">P&amp;L</div><h1 class="h-title">Contribution Margin — ${BLAB[b]} 2026</h1>
  <p class="h-sub">Format lengkap per baris akun. Kolom ${ACTF[b]} dibandingkan Plan bulan yang sama dan bulan sebelumnya.</p>`;
  const prevB=b==='Sep'?'Ags':b==='Ags'?'Jul':null;
  const A=agg(pAct(b),L),P=agg(pPlan(b),L),PV=prevB?agg(pAct(prevB),L):null;
  h+='<div class="panel card" style="margin-top:16px"><div style="overflow:auto"><table><thead><tr><th>Rp juta</th>'
    +`<th>Plan ${b}</th><th>${ACTF[b]} ${b}</th>`+(PV?`<th>${ACTF[prevB]} ${prevB}</th>`:'')
    +`<th>vs Plan</th>`+(PV?`<th>vs ${prevB}</th>`:'')+`<th>% GS Plan</th><th>% GS ${ACTF[b]}</th><th>Δ pp</th></tr></thead><tbody>`;
  D.met.forEach(k=>{
    const cls=SUB.has(k)?'sub':'', inv=INV.has(k);
    const a=A[MI[k]],p=P[MI[k]],pv=PV?PV[MI[k]]:null;
    const d1=a-p, d2=PV?a-pv:null;
    const c1=(inv?d1<=0:d1>=0)?'pos':'neg', c2=PV?((inv?d2<=0:d2>=0)?'pos':'neg'):'';
    h+=`<tr class="${cls}"><td>${D.metLab[k]}</td><td class="num">${jt1(p)}</td><td class="num">${jt1(a)}</td>`
      +(PV?`<td class="num">${jt1(pv)}</td>`:'')
      +`<td class="num ${c1}">${sgn(d1)}</td>`+(PV?`<td class="num ${c2}">${sgn(d2)}</td>`:'')
      +`<td class="num mut">${pc(p/P[MI.R010],1)}</td><td class="num">${pc(a/A[MI.R010],1)}</td>`
      +`<td class="num ${((inv? (a/A[MI.R010]-p/P[MI.R010])<=0 : (a/A[MI.R010]-p/P[MI.R010])>=0))?'pos':'neg'}">${pp((a/A[MI.R010]-p/P[MI.R010])*100)}</td></tr>`;
  });
  h+='</tbody></table></div><div class="src">COGS = Food Cost + Consumables + Inventory Variance. Spoil &amp; Waste dan Expired Material ada di Variable Opex.</div></div>';

  // detail akun
  h+=`<div class="sec-h"><h2>Rincian per akun</h2><span class="d">Akun leaf di bawah tiap baris P&amp;L</span></div>`;
  const ar=accAgg(pAct(b),L), arP=accAgg(pPlan(b),L), arV=prevB?accAgg(pAct(prevB),L):null;
  const byline={};
  D.accounts.forEach(a=>{(byline[a.pl]=byline[a.pl]||[]).push(a);});
  const ORD=[['Gross Sales — Store','R010'],['(-) Commission of Sales','R020'],['(-) Discount','R030'],
    ['(-) Cofunding','R040'],['(+) Platform Price Adjustment','R050'],['(+) Packaging Revenue','R060'],
    ['Food Cost','R080'],['Consumables','R090'],['Inventory Variance','R100'],
    ['Variable Opex — Store','R130'],['Fixed Opex — Operational (incl D&A)','R150'],
    ['Fixed Opex — HR','R160'],['Fixed Opex — Marketing','R170']];
  h+='<div class="panel card"><div style="overflow:auto"><table><thead><tr><th>Akun</th><th>Kode</th><th>Sifat</th>'
    +`<th>Plan ${b}</th><th>${ACTF[b]} ${b}</th>`+(PV?`<th>${ACTF[prevB]} ${prevB}</th>`:'')+'<th>vs Plan</th></tr></thead><tbody>';
  ORD.forEach(([pl,mk])=>{
    const list=(byline[pl]||[]).filter(a=>(ar[a.i]||arP[a.i]||(arV&&arV[a.i])));
    if(!list.length&&!A[MI[mk]])return;
    h+=`<tr class="sub"><td>${esc(pl)}</td><td></td><td></td><td class="num">${jt1(P[MI[mk]])}</td><td class="num">${jt1(A[MI[mk]])}</td>`
      +(PV?`<td class="num">${jt1(PV[MI[mk]])}</td>`:'')+`<td class="num">${sgn(A[MI[mk]]-P[MI[mk]])}</td></tr>`;
    list.sort((x,y)=>(ar[y.i]||0)-(ar[x.i]||0)).forEach(a=>{
      const av=ar[a.i]||0,pv2=arP[a.i]||0,vv=arV?(arV[a.i]||0):0;
      h+=`<tr><td style="padding-left:22px">${esc(a.n)}</td><td class="num mut" style="text-align:left">${a.cd}</td>`
       +`<td style="text-align:left"><span class="pill p-m">${esc(a.nat)}</span></td>`
       +`<td class="num mut">${jt1(pv2)}</td><td class="num">${jt1(av)}</td>`+(PV?`<td class="num mut">${jt1(vv)}</td>`:'')
       +`<td class="num ${((INV.has(mk)?av-pv2<=0:av-pv2>=0))?'pos':'neg'}">${sgn(av-pv2)}</td></tr>`;
    });
  });
  h+='</tbody></table></div><div class="src">Rincian akun tersedia untuk Juli aktual, Agustus aktual, September run-rate, dan September plan. Plan Juli dan Agustus hanya tersedia di level baris P&amp;L.</div></div>';
  return h;
}
function accAgg(pi,L){const set=new Set(L),o={};
  for(const r of D.arows){if(r[0]===pi&&set.has(r[1]))o[r[2]]=(o[r[2]]||0)+r[3]*K;}return o;}

/* =======================================================================
   KONSENTRASI PROFIT
   ======================================================================= */
function pgConc(){
  const L=ids(),b=S.bulan,pa=pAct(b);
  const prevB=b==='Sep'?'Ags':b==='Ags'?'Jul':null;
  const srt=L.slice().sort((x,y)=>dp(pa,y)-dp(pa,x));
  const tot=srt.reduce((t,i)=>t+dp(pa,i),0);
  const nm=i=>D.stores[i].id+' '+D.stores[i].nm;
  let h=`<div class="eyebrow">Konsentrasi</div><h1 class="h-title">Siapa yang menopang profit, dan ke mana arahnya</h1>
  <p class="h-sub">Pertanyaannya bukan berapa profitnya, tapi apakah store yang menanggung profit sedang naik atau turun. Kalau penopang turun dan digantikan kenaikan store kecil, kualitas profitnya berbeda.</p>`;

  // kelompok desil
  const grp=[['Top 10%',0,.1],['11–25%',.1,.25],['26–50%',.25,.5],['51–75%',.5,.75],['Bawah 25%',.75,1]];
  const n=srt.length;
  let rows='';
  grp.forEach(([lab,a,c])=>{
    const seg=srt.slice(Math.round(n*a),Math.round(n*c));
    const now=seg.reduce((t,i)=>t+dp(pa,i),0);
    const prev=prevB?seg.reduce((t,i)=>t+dp(pAct(prevB),i),0):null;
    const gsn=seg.reduce((t,i)=>t+gs(pa,i),0);
    rows+=`<tr><td>${lab}</td><td class="num">${seg.length}</td><td class="num">${jt1(gsn)}</td><td class="num">${jt1(now)}</td>
      <td class="num">${pc(now/tot,1)}</td><td class="num">${pc(now/Math.max(gsn,1),1)}</td>`
      +(prevB?`<td class="num ${now-prev>=0?'pos':'neg'}">${sgn(now-prev)}</td><td class="num ${now-prev>=0?'pos':'neg'}">${prev?pc((now-prev)/Math.abs(prev),1):'—'}</td>`:'')+'</tr>';
  });
  h+=`<div class="grid g12" style="margin-top:16px">
    <div class="panel card">${chPareto(srt,tot)}</div>
    <div class="panel card"><table><thead><tr><th>Kelompok</th><th>Store</th><th>Gross Sales</th><th>Direct Profit</th><th>Share profit</th><th>Margin</th>`
    +(prevB?`<th>Δ vs ${prevB}</th><th>Δ %</th>`:'')+`</tr></thead><tbody>${rows}</tbody></table>
    <div class="note-s">Rp juta. Kelompok dibentuk dari peringkat Direct Profit ${BLAB[b]}, bukan peringkat bulan sebelumnya.</div></div></div>`;

  if(prevB){
    const chg=L.map(i=>({i,d:dp(pa,i)-dp(pAct(prevB),i),now:dp(pa,i),prev:dp(pAct(prevB),i)}));
    const up=chg.filter(x=>x.d>0).sort((a,c)=>c.d-a.d), dn=chg.filter(x=>x.d<0).sort((a,c)=>a.d-c.d);
    const rank=new Map(srt.map((i,k)=>[i,k]));
    const topN=Math.max(1,Math.round(n*0.25));
    const topDn=dn.filter(x=>rank.get(x.i)<topN);
    h+=`<div class="sec-h"><h2>Pergerakan ${BLAB[prevB]} → ${BLAB[b]}</h2><span class="d">Kontributor kenaikan dan penurunan terbesar</span></div>
    <div class="panel card">${chMove(chg,rank,topN)}</div>
    <div class="grid g2" style="margin-top:14px">
      ${listBox('Turun terbesar','coral',dn.slice(0,8),rank,topN,prevB)}
      ${listBox('Naik terbesar','green',up.slice(0,8),rank,topN,prevB)}
    </div>
    <div class="panel card" style="margin-top:14px">${narr(topDn.length?'coral':'green',
      topDn.length?`${topDn.length} store kuartil atas sedang turun`:'Tidak ada store kuartil atas yang turun',
      topDn.length?`Store di kuartil atas menanggung ${pc(srt.slice(0,topN).reduce((t,i)=>t+dp(pa,i),0)/tot,0)} profit. ${topDn.length} di antaranya turun dengan total <b>${sgn(topDn.reduce((t,x)=>t+x.d,0))} juta</b>: ${topDn.slice(0,6).map(x=>`${esc(nm(x.i))} (${sgn(x.d)} jt)`).join(', ')}. Penurunan di sini lebih mahal daripada di store kecil karena basisnya besar dan sulit digantikan.`
      :`Seluruh store di kuartil atas — ${topN} store yang menanggung ${pc(srt.slice(0,topN).reduce((t,i)=>t+dp(pa,i),0)/tot,0)} profit — bergerak naik atau datar terhadap ${BLAB[prevB]}.`)}</div>`;
  }
  return h;
}
function listBox(t,c,arr,rank,topN,prevB){
  const nm=i=>D.stores[i].id+' '+D.stores[i].nm;
  let h=`<div class="panel card"><div class="lab" style="font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600;font-family:JetBrains Mono">${t}</div>
  <table style="margin-top:9px"><thead><tr><th>Store</th><th>${prevB}</th><th>Kini</th><th>Δ</th><th>Peringkat</th></tr></thead><tbody>`;
  arr.forEach(x=>{const q=rank.get(x.i)<topN?'<span class="pill p-a">kuartil atas</span>':'<span class="pill p-m">#'+(rank.get(x.i)+1)+'</span>';
    h+=`<tr><td>${esc(nm(x.i))}</td><td class="num mut">${jt1(x.prev)}</td><td class="num">${jt1(x.now)}</td><td class="num ${x.d>=0?'pos':'neg'}">${sgn(x.d)}</td><td style="text-align:left">${q}</td></tr>`;});
  return h+'</tbody></table><div class="note-s">Rp juta.</div></div>';
}
function chPareto(srt,tot){
  const W=420,H=300,ml=10,mr=52,mt=16,mb=40,n=srt.length;
  const x=i=>ml+(W-ml-mr)*(i/(n-1));
  let cum=0;const cu=srt.map(i=>{cum+=dp(pAct(S.bulan),i);return cum/tot;});
  const mxb=Math.max(...srt.map(i=>dp(pAct(S.bulan),i)));
  const yb=v=>mt+(H-mt-mb)*(1-v/(mxb*1.05));
  const yc=v=>mt+(H-mt-mb)*(1-v);
  let s='';for(let k=0;k<=4;k++){const v=k/4;s+=`<line x1="${ml}" x2="${W-mr}" y1="${yc(v)}" y2="${yc(v)}" stroke="#E8E3DD"/><text x="${W-mr+6}" y="${yc(v)+4}" font-size="10" fill="#95897C" font-family="JetBrains Mono">${(v*100).toFixed(0)}%</text>`;}
  const bw=Math.max(2,(W-ml-mr)/n*0.7);
  srt.forEach((i,k)=>{const v=dp(pAct(S.bulan),i);
    s+=`<rect class="hv" x="${x(k)-bw/2}" y="${v>=0?yb(v):yb(0)}" width="${bw}" height="${Math.max(1,Math.abs(yb(v)-yb(0)))}" rx="1.5" fill="${v>=0?'#CFC7BD':PAL.coral}" data-tip="<b>${esc(D.stores[i].id+' '+D.stores[i].nm)}</b><br>Direct Profit ${rp(v)}<br>Kumulatif ${pc(cu[k],1)}"/>`;});
  s+=`<path d="${cu.map((v,k)=>(k?'L':'M')+x(k)+' '+yc(v)).join(' ')}" fill="none" stroke="${PAL.gold}" stroke-width="2.5"/>`;
  const i50=cu.findIndex(v=>v>=0.5)+1, i80=cu.findIndex(v=>v>=0.8)+1;
  [[i50,'50%'],[i80,'80%']].forEach(([ii,lb])=>{if(ii>0){s+=`<line x1="${x(ii-1)}" x2="${x(ii-1)}" y1="${mt}" y2="${H-mb}" stroke="${PAL.blue}" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${x(ii-1)+4}" y="${mt+11}" font-size="10" fill="${PAL.blue}" font-family="JetBrains Mono">${ii} store = ${lb}</text>`;}});
  s+=`<text x="${ml}" y="${H-8}" font-size="10" fill="#95897C">peringkat 1</text><text x="${W-mr}" y="${H-8}" text-anchor="end" font-size="10" fill="#95897C">peringkat ${n}</text>`;
  return `<div class="legend"><span><i style="background:#CFC7BD"></i>Direct Profit per store</span><span><i style="background:${PAL.gold}"></i>Kumulatif share</span><span><i style="background:${PAL.coral}"></i>Rugi</span></div><svg viewBox="0 0 ${W} ${H}" width="100%">${s}</svg>`;
}
function chMove(chg,rank,topN){
  const W=900,H=210,mt=18,mb=26;
  const arr=chg.slice().sort((a,b)=>b.d-a.d);
  const mx=Math.max(...arr.map(x=>Math.abs(x.d)))*1.08;
  const n=arr.length,bw=(W-12)/n*0.74,gap=(W-12)/n;
  const y0=mt+(H-mt-mb)/2, y=v=>y0-(H-mt-mb)/2*(v/mx);
  let s=`<line x1="0" x2="${W}" y1="${y0}" y2="${y0}" stroke="#DAD3CB"/>`;
  arr.forEach((x,k)=>{const cx=6+gap*k+gap/2;const top=rank.get(x.i)<topN;
    s+=`<rect class="hv" x="${cx-bw/2}" y="${Math.min(y(x.d),y0)}" width="${bw}" height="${Math.max(1.5,Math.abs(y(x.d)-y0))}" rx="2"
      fill="${x.d>=0?PAL.green:PAL.coral}" opacity="${top?1:.4}"
      data-tip="<b>${esc(D.stores[x.i].id+' '+D.stores[x.i].nm)}</b><br>Peringkat profit #${rank.get(x.i)+1}${top?' (kuartil atas)':''}<br>Δ ${sgn(x.d)} jt"/>`;});
  return `<div class="legend"><span><i style="background:${PAL.green}"></i>Naik</span><span><i style="background:${PAL.coral}"></i>Turun</span><span><i style="background:#CFC7BD"></i>Buram = di luar kuartil atas</span></div>
  <svg viewBox="0 0 ${W} ${H}" width="100%">${s}</svg>
  <div class="note-s">Rp juta. Batang pekat adalah ${topN} store kuartil atas berdasarkan profit ${BLAB[S.bulan]}. Batang merah pekat adalah yang paling perlu ditindak.</div>`;
}

/* =======================================================================
   TARGET
   ======================================================================= */
function pgTgt(){
  const L=ids(),b=S.bulan,pa=pAct(b),pp_=pPlan(b);
  const rowsAll=L.map(i=>{const a=dp(pa,i),p=dp(pp_,i);
    return {i,a,p,d:a-p,r:p>0?a/p:(a>0?2:0)};});
  const ach=rowsAll.filter(x=>x.d>=0);
  const band=[['≥ 120% target','green',x=>x.p>0&&x.r>=1.2],['100–120%','green',x=>x.p>0&&x.r>=1&&x.r<1.2],
    ['80–100%','amber',x=>x.p>0&&x.r>=0.8&&x.r<1],['50–80%','amber',x=>x.p>0&&x.r>=0.5&&x.r<0.8],
    ['< 50%','coral',x=>x.p>0&&x.r<0.5&&x.a>0],['Rugi','coral',x=>x.a<=0]];
  let h=`<div class="eyebrow">Target</div><h1 class="h-title">Pencapaian target profit — ${BLAB[b]} 2026</h1>
  <p class="h-sub">Target adalah Store Direct Profit pada Plan bulan yang sama, per store. ${ach.length} dari ${L.length} store (${pc(ach.length/L.length,0)}) mencapai atau melampauinya.</p>
  <div class="grid g4" style="margin-top:16px">
    ${kpi('Capai target',pc(ach.length/L.length,0),ach.length+' dari '+L.length+' store',ach.length/L.length>=.5?'green':'coral')}
    ${kpi('Surplus dari yang capai','+'+jt(ach.reduce((t,x)=>t+x.d,0))+' jt',ach.length+' store di atas target','green')}
    ${kpi('Defisit dari yang meleset','\u2212'+jt(Math.abs(rowsAll.filter(x=>x.d<0).reduce((t,x)=>t+x.d,0)))+' jt',(L.length-ach.length)+' store di bawah target','coral')}
    ${kpi('Gap bersih',sgn(rowsAll.reduce((t,x)=>t+x.d,0))+' jt','Terhadap total target '+rp(rowsAll.reduce((t,x)=>t+x.p,0)),rowsAll.reduce((t,x)=>t+x.d,0)>=0?'green':'coral')}
  </div>`;
  let br='';
  band.forEach(([lab,c,f])=>{const g=rowsAll.filter(f);
    br+=`<tr><td><span class="pill p-${c[0]==='g'?'g':c[0]==='a'?'a':'r'}">${lab}</span></td><td class="num">${g.length}</td>
    <td class="num">${pc(g.length/L.length,0)}</td><td class="num">${jt1(g.reduce((t,x)=>t+x.a,0))}</td>
    <td class="num mut">${jt1(g.reduce((t,x)=>t+x.p,0))}</td><td class="num ${g.reduce((t,x)=>t+x.d,0)>=0?'pos':'neg'}">${sgn(g.reduce((t,x)=>t+x.d,0))}</td></tr>`;});
  h+=`<div class="grid g21" style="margin-top:16px">
   <div class="panel card">${chGap(rowsAll)}</div>
   <div class="panel card"><table><thead><tr><th>Band pencapaian</th><th>Store</th><th>%</th><th>Aktual</th><th>Target</th><th>Gap</th></tr></thead><tbody>${br}</tbody></table>
   <div class="note-s">Rp juta. Store dengan target nol atau negatif dikelompokkan berdasar hasil aktualnya.</div></div></div>`;
  // tabel gap terbesar
  const wr=rowsAll.slice().sort((a,c)=>a.d-c.d);
  h+=`<div class="sec-h"><h2>Gap terbesar terhadap target</h2><span class="d">12 defisit terbesar dan 6 pencapaian terbaik</span></div>
  <div class="panel card"><table><thead><tr><th>Store</th><th>SOM</th><th>Region</th><th>Gross Sales</th><th>Target DP</th><th>Aktual DP</th><th>Gap</th><th>Capai</th></tr></thead><tbody>`;
  wr.slice(0,12).concat(wr.slice(-6).reverse()).forEach(x=>{const s=D.stores[x.i];
    h+=`<tr class="stk" data-s="${x.i}"><td>${esc(s.id+' '+s.nm)}</td><td style="text-align:left">${esc(s.som)}</td><td style="text-align:left" class="mut">${esc(s.reg)}</td>
    <td class="num">${jt1(gs(pa,x.i))}</td><td class="num mut">${jt1(x.p)}</td><td class="num">${jt1(x.a)}</td>
    <td class="num ${x.d>=0?'pos':'neg'}">${sgn(x.d)}</td><td class="num">${x.p>0?pc(x.r,0):'—'}</td></tr>`;});
  return h+'</tbody></table><div class="note-s">Rp juta. Klik baris untuk melihat P&amp;L store.</div></div>';
}
function chGap(rows){
  const W=560,H=300,ml=8,mt=14,mb=30;
  const arr=rows.slice().sort((a,b)=>b.d-a.d);
  const mx=Math.max(...arr.map(x=>Math.abs(x.d)))*1.06;
  const n=arr.length,gap=(W-ml*2)/n,bw=gap*0.74;
  const y0=mt+(H-mt-mb)/2,y=v=>y0-(H-mt-mb)/2*(v/mx);
  let s=`<line x1="${ml}" x2="${W-ml}" y1="${y0}" y2="${y0}" stroke="#DAD3CB"/>`;
  arr.forEach((x,k)=>{const cx=ml+gap*k+gap/2;
    s+=`<rect class="hv" x="${cx-bw/2}" y="${Math.min(y(x.d),y0)}" width="${bw}" height="${Math.max(1.5,Math.abs(y(x.d)-y0))}" rx="2" fill="${x.d>=0?PAL.green:PAL.coral}"
      data-tip="<b>${esc(D.stores[x.i].id+' '+D.stores[x.i].nm)}</b><br>Target ${rp(x.p)}<br>Aktual ${rp(x.a)}<br>Gap ${sgn(x.d)} jt"/>`;});
  s+=`<text x="${ml}" y="${H-10}" font-size="10" fill="#95897C">di atas target</text><text x="${W-ml}" y="${H-10}" text-anchor="end" font-size="10" fill="#95897C">di bawah target</text>`;
  return `<div class="legend"><span><i style="background:${PAL.green}"></i>Di atas target</span><span><i style="background:${PAL.coral}"></i>Di bawah target</span></div><svg viewBox="0 0 ${W} ${H}" width="100%">${s}</svg>
  <div class="note-s">Rp juta. Satu batang satu store, diurutkan dari surplus terbesar ke defisit terbesar.</div>`;
}

/* =======================================================================
   PER STORE
   ======================================================================= */
const COLS=[['nm','Store','l'],['som','SOM','l'],['reg','Region','l'],['gs','Gross Sales','n'],
  ['cm','Contribution Margin','n'],['cmp','CM % GS','p'],['dp','Direct Profit','n'],['dpp','DP % GS','p'],
  ['tgt','Target DP','n'],['gap','Gap','n'],['mom','Δ MoM','n']];
function rowsStore(){
  const L=ids(),b=S.bulan,pa=pAct(b),pp_=pPlan(b);
  const prevB=b==='Sep'?'Ags':b==='Ags'?'Jul':null;
  return L.map(i=>{const a=vec(pa,i),p=vec(pp_,i);const s=D.stores[i];
    return {i,nm:s.id+' '+s.nm,som:s.som,reg:s.reg,gs:a[MI.R010],nr:a[MI.R070],gp:a[MI.R120],
      cm:a[MI.R140],cmp:a[MI.R140]/Math.max(a[MI.R010],1),dp:a[MI.R190],dpp:a[MI.R190]/Math.max(a[MI.R010],1),
      tgt:p[MI.R190],gap:a[MI.R190]-p[MI.R190],mom:prevB?a[MI.R190]-dp(pAct(prevB),i):null};});
}
function pgStore(){
  const R=rowsStore().sort((a,b)=>(a[S.sortK]>b[S.sortK]?1:-1)*S.sortD);
  const T=R.reduce((t,r)=>{['gs','nr','gp','cm','dp','tgt','gap'].forEach(k=>t[k]=(t[k]||0)+r[k]);return t;},{});
  let h=`<div class="eyebrow">Per store</div><h1 class="h-title">Telusur ${R.length} store — ${BLAB[S.bulan]} 2026</h1>
  <p class="h-sub">Klik kolom untuk mengurutkan, klik baris untuk membuka P&amp;L store beserta rincian akunnya.</p>
  <div class="panel card scroll" style="margin-top:16px"><table><thead><tr>`;
  COLS.forEach(([k,l,t])=>h+=`<th class="sh" data-k="${k}" style="cursor:pointer;text-align:${t==='l'?'left':'right'}">${l}${S.sortK===k?(S.sortD>0?' ▲':' ▼'):''}</th>`);
  h+='</tr></thead><tbody>';
  R.forEach(r=>{h+=`<tr class="stk" data-s="${r.i}">`;
    COLS.forEach(([k,l,t])=>{
      let v=r[k];
      if(t==='l')h+=`<td style="text-align:left">${esc(v)}</td>`;
      else if(t==='p')h+=`<td class="num ${v<0?'neg':''}">${pc(v,1)}</td>`;
      else if(v===null)h+='<td class="num mut">—</td>';
      else if(k==='gap'||k==='mom')h+=`<td class="num ${v>=0?'pos':'neg'}">${sgn(v)}</td>`;
      else h+=`<td class="num ${v<0?'neg':''}">${jt1(v)}</td>`;});
    h+='</tr>';});
  h+=`<tr class="tot"><td>TOTAL ${R.length} store</td><td></td><td></td><td class="num">${jt1(T.gs)}</td>
   <td class="num">${jt1(T.cm)}</td><td class="num">${pc(T.cm/T.gs,1)}</td>
   <td class="num">${jt1(T.dp)}</td><td class="num">${pc(T.dp/T.gs,1)}</td><td class="num">${jt1(T.tgt)}</td>
   <td class="num">${sgn(T.gap)}</td><td class="num">${R[0].mom===null?'—':sgn(R.reduce((t,r)=>t+r.mom,0))}</td></tr>`;
  return h+'</tbody></table></div><div class="note-s">Rp juta.</div>';
}
function drawer(i){
  const b=S.bulan,pa=pAct(b),pp_=pPlan(b),s=D.stores[i];
  const prevB=b==='Sep'?'Ags':b==='Ags'?'Jul':null;
  const a=vec(pa,i),p=vec(pp_,i),pv=prevB?vec(pAct(prevB),i):null;
  let h=`<button class="x" onclick="closeDrawer()">×</button>
  <div class="eyebrow">Store</div><h2 style="font-size:20px;margin:8px 0 3px">${esc(s.id+' '+s.nm)}</h2>
  <div class="chips"><span class="chip">SOM ${esc(s.som)}</span><span class="chip">${esc(s.reg)}</span>
  <span class="chip">${BLAB[b]} · ${ACTF[b]}</span></div>
  <div style="overflow:auto"><table style="margin-top:16px"><thead><tr><th>Rp juta</th><th>Plan</th><th>${ACTF[b]}</th>`+(pv?`<th>${prevB}</th>`:'')+`<th>vs Plan</th><th>% GS</th></tr></thead><tbody>`;
  D.met.forEach(k=>{const inv=INV.has(k),d=a[MI[k]]-p[MI[k]];
    h+=`<tr class="${SUB.has(k)?'sub':''}"><td>${D.metLab[k]}</td><td class="num mut">${jt1(p[MI[k]])}</td>
    <td class="num">${jt1(a[MI[k]])}</td>`+(pv?`<td class="num mut">${jt1(pv[MI[k]])}</td>`:'')
    +`<td class="num ${(inv?d<=0:d>=0)?'pos':'neg'}">${sgn(d)}</td><td class="num">${pc(a[MI[k]]/Math.max(a[MI.R010],1),1)}</td></tr>`;});
  h+='</tbody></table></div>';
  const ar={},arP={};
  for(const r of D.arows){if(r[1]===i){if(r[0]===pa)ar[r[2]]=(ar[r[2]]||0)+r[3]*K;if(r[0]===pp_)arP[r[2]]=(arP[r[2]]||0)+r[3]*K;}}
  const keys=Object.keys(ar).concat(Object.keys(arP).filter(k=>!(k in ar)));
  if(keys.length){
    h+='<h3 style="font-size:14px;margin:20px 0 8px">Rincian akun</h3><div style="overflow:auto"><table><thead><tr><th>Akun</th><th>Baris P&amp;L</th><th>Plan</th><th>Nilai</th></tr></thead><tbody>';
    keys.map(k=>({k:+k,v:ar[k]||0,p:arP[k]||0})).sort((x,y)=>y.v-x.v).forEach(x=>{const A=D.accounts[x.k];
      h+=`<tr><td>${esc(A.n)}</td><td style="text-align:left" class="mut">${esc(A.pl)}</td><td class="num mut">${jt1(x.p)}</td><td class="num">${jt1(x.v)}</td></tr>`;});
    h+='</tbody></table></div>';
  }
  const el=document.getElementById('drawer');el.innerHTML=h;el.classList.add('on');document.getElementById('ov').classList.add('on');
}
function closeDrawer(){document.getElementById('drawer').classList.remove('on');document.getElementById('ov').classList.remove('on');}

/* =======================================================================
   BASIS
   ======================================================================= */
function pgBasis(){
  let h=`<div class="eyebrow">Basis</div><h1 class="h-title">Dari mana angkanya, dan apa yang masih perlu diperbaiki</h1>
  <p class="h-sub">Dashboard ini dirakit tanpa pipeline otomatis. Setiap angka punya sumber dan aturan run-rate yang tercatat, dan hal yang belum bisa dipercaya penuh ditulis apa adanya di bawah.</p>
  <div class="warnbox" style="margin-top:16px"><b>Yang paling perlu diperhatikan.</b> ${WARN}</div>
  <div class="sec-h"><h2>Basis tiap periode</h2></div>
  <div class="panel card"><div style="overflow:auto"><table><thead><tr><th>Periode</th><th>Basis</th><th>Cakupan akun</th><th>D&amp;A dialokasikan</th></tr></thead><tbody>
  <tr><td>Juli 2026 · Aktual</td><td style="text-align:left">General Ledger Odoo, VDB Januari–Juli</td><td style="text-align:left">Food Cost dihitung Beginning + Purchased − Ending, jadi selisih inventory sudah menyatu di dalamnya</td><td style="text-align:left"><span class="pill p-g">Ya</span></td></tr>
  <tr><td>Agustus 2026 · Aktual</td><td style="text-align:left">P&amp;L manajemen per store, tab August_Actual</td><td style="text-align:left">Food Cost, Consumables, dan Inventory Variance terpisah</td><td style="text-align:left"><span class="pill p-r">Tidak</span></td></tr>
  <tr><td>September 2026 · Run-rate</td><td style="text-align:left">Tab 01–12 dataset MAPI September, disetahunkan ke 30 hari</td><td style="text-align:left">Akun tanpa sumber bergerak memakai baseline Agustus</td><td style="text-align:left"><span class="pill p-r">Tidak</span></td></tr>
  <tr><td>Plan Juli / Agustus / September</td><td style="text-align:left">Adjusted Plan, engine PL_CostCenter_Monthly</td><td style="text-align:left">Split COGS dikoreksi ke Food Cost 29% dan Consumables 4% dari Gross Sales, Inventory Variance 0%, total COGS per store tidak berubah</td><td style="text-align:left"><span class="pill p-g">Ya</span></td></tr>
  </tbody></table></div>
  <div class="note-s">Karena Agustus dan run-rate September belum mengalokasikan D&amp;A ke store, aktifkan tombol <b>Setarakan D&amp;A</b> di bar filter untuk menambahkan D&amp;A Rp ${jt(D.da.reduce((a,b)=>a+b,0)*K)} juta ke kedua periode itu sehingga sebanding dengan Juli dan Plan.</div></div>

  <div class="sec-h"><h2>Basis run-rate September per akun</h2><span class="d">Diurutkan dari nilai terbesar</span></div>
  <div class="panel card scroll"><table><thead><tr><th>Akun</th><th>Rp juta</th><th>Basis</th></tr></thead><tbody>`;
  D.basis.forEach(b=>{const bl=b.b.startsWith('Baseline');
    h+=`<tr><td>${esc(b.a)}</td><td class="num">${jt1(b.rp*K)}</td><td style="text-align:left">${bl?'<span class="pill p-a">baseline</span> ':'<span class="pill p-b">data bergerak</span> '}<span class="mut">${esc(b.b)}</span></td></tr>`;});
  h+=`</tbody></table></div>
  <div class="sec-h"><h2>Catatan kualitas data</h2></div><div class="panel card">`+NOTES+'</div>';
  return h;
}

/* =======================================================================
   render
   ======================================================================= */
const PG={sum:pgSum,pl:pgPL,conc:pgConc,tgt:pgTgt,store:pgStore,basis:pgBasis};
function render(){
  const L=ids();
  document.getElementById('scopeTxt').textContent=`${L.length} store · ${BLAB[S.bulan]} ${ACTF[S.bulan]}`+(S.da?' · D&A disetarakan':'');
  const el=document.getElementById('p-'+S.tab);
  el.innerHTML=PG[S.tab]();
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='p-'+S.tab));
  el.querySelectorAll('.hv').forEach(bind);
  el.querySelectorAll('.stk').forEach(r=>r.addEventListener('click',()=>drawer(+r.dataset.s)));
  el.querySelectorAll('.sh').forEach(th=>th.addEventListener('click',()=>{
    const k=th.dataset.k; if(S.sortK===k)S.sortD*=-1;else{S.sortK=k;S.sortD=-1;} render();}));
}
function init(){
  const sp=document.getElementById('segPer');
  sp.innerHTML=BULAN.map(b=>`<button data-b="${b}" class="${b===S.bulan?'on':''}">${BLAB[b]}</button>`).join('');
  sp.addEventListener('click',e=>{const b=e.target.dataset.b;if(!b)return;S.bulan=b;
    sp.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.b===b));render();});
  const soms=[...new Set(D.stores.map(s=>s.som))].sort();
  const regs=[...new Set(D.stores.map(s=>s.reg))].sort();
  document.getElementById('selSom').innerHTML='<option value="">Semua SOM</option>'+soms.map(s=>`<option>${esc(s)}</option>`).join('');
  document.getElementById('selReg').innerHTML='<option value="">Semua region</option>'+regs.map(s=>`<option>${esc(s)}</option>`).join('');
  document.getElementById('selSom').onchange=e=>{S.som=e.target.value;render();};
  document.getElementById('selReg').onchange=e=>{S.reg=e.target.value;render();};
  document.getElementById('tglDA').onclick=function(){S.da=!S.da;this.classList.toggle('on',S.da);render();};
  document.getElementById('tabs').addEventListener('click',e=>{const p=e.target.dataset.p;if(!p)return;S.tab=p;
    document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));render();});
  document.getElementById('ov').onclick=closeDrawer;
  render();
}
const WARN=`Tab 01 mencatat cofunding GrabFood nol dan memasukkannya ke commission. Total take GrabFood jadi 38,0% terhadap 43,1% di Agustus — selisih 5,1 pp atau sekitar <b>Rp 437 juta sebulan</b> yang membuat Net Revenue run-rate September tampak lebih tinggi dari seharusnya. Angka di dashboard dipakai apa adanya sesuai sumber; perbaikannya ada di sisi laporan, bukan di sini.`;
const NOTES=`
<div class="narr" style="border-color:var(--amber)"><div class="verdict" style="color:var(--amber)"><span class="dot" style="background:var(--amber)"></span>Rent dan D&amp;A memakai baseline Agustus</div><p>Payment voucher September hanya memuat tiga baris rent dan ketiganya perpanjangan sewa multi-periode (Kemayoran Rp 140,0 juta, Padalarang Rp 78,0 juta), bukan beban bulan berjalan. Rent, depresiasi, amortisasi, distribution fee, dan storage &amp; handling memakai baseline tetap Agustus sesuai arahan.</p></div>
<div class="narr" style="border-color:var(--amber)"><div class="verdict" style="color:var(--amber)"><span class="dot" style="background:var(--amber)"></span>Utilities dan repair memakai basis kas</div><p>Keduanya ditarik dari payment voucher 1–16 September lalu disetahunkan. Pembayaran bersifat bergelombang sehingga run-rate-nya bisa lebih tinggi atau rendah dari beban sebenarnya.</p></div>
<div class="narr" style="border-color:var(--green)"><div class="verdict" style="color:var(--green)"><span class="dot" style="background:var(--green)"></span>Supplies Expense benar dari dua sumber</div><p>Payment voucher berisi sewa unit freezer, petty cash berisi ATK dan perlengkapan. Distribusi per store-nya berbeda total, jadi keduanya dijumlahkan dan bukan dobel hitung.</p></div>
<div class="narr" style="border-color:var(--green)"><div class="verdict" style="color:var(--green)"><span class="dot" style="background:var(--green)"></span>Ads GrabFood dipakai nilai absolutnya</div><p>Sumbernya tracker gap settlement yang menulis beban ads GrabFood dengan tanda negatif. Nilai absolutnya yang dipakai sebagai beban.</p></div>
<div class="narr" style="border-color:var(--green)"><div class="verdict" style="color:var(--green)"><span class="dot" style="background:var(--green)"></span>Hari parsial dibuang berdasarkan nilai</div><p>Hari terakhir sering sudah punya banyak baris tapi nilainya baru separuh. Deteksinya memakai nilai harian di bawah 50% median, bukan jumlah record. Tanggal di luar rentang bulan juga ditolak.</p></div>
<div class="narr" style="border-color:var(--amber)"><div class="verdict" style="color:var(--amber)"><span class="dot" style="background:var(--amber)"></span>Juli berbasis General Ledger, Agustus dan September berbasis manajemen</div><p>Di Juli, selisih inventory sudah menyatu di dalam Food Cost karena dihitung dari Beginning + Purchased − Ending. Di Agustus dan September, Inventory Variance berdiri sendiri. Perbandingan di level Total COGS tetap sah; perbandingan Food Cost saja tidak.</p></div>`;
init();
</script>
